<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classification result · Solar Dust Detector</title> 
  <style>
    :root { font-family: "Segoe UI", sans-serif; color: #172b36; background: #f3f7f5; } 
    * { box-sizing: border-box; } 
    body { margin: 0; min-height: 100vh; }
    header { height: 76px; padding: 0 max(7vw, 28px); display: flex; align-items: center; background: #fff; border-bottom: 1px solid #e4ece7; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
    .brand-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: #147d59; font-size: 20px; }
    main { max-width: 720px; margin: 72px auto; padding: 0 24px; }
    .card { padding: 42px; text-align: center; background: #fff; border: 1px solid #e2ebe5; border-radius: 20px; box-shadow: 0 18px 55px #1f46300c; } 
    .check { width: 68px; height: 68px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; color: #147d59; background: #e8f5ee; font-size: 31px; } 
    .eyebrow { color: #16805b; text-transform: uppercase; letter-spacing: .13em; font-size: 12px; font-weight: 700; }
    h1 { margin: 12px 0 8px; font-size: 42px; letter-spacing: -.03em; }
    .muted { color: #708184; }
    .score { max-width: 420px; margin: 28px auto; padding: 18px 20px; display: flex; justify-content: space-between; border-radius: 12px; background: #f6faf7; color: #50676a; }
    .score strong { color: #147d59; }
    .filename { overflow-wrap: anywhere; font-size: 13px; } 
    a { display: inline-block; margin-top: 18px; padding: 13px 21px; border-radius: 10px; background: #147d59; color: #fff; text-decoration: none; font-weight: 700; }
  </style> 
</head>
<body> 
  <header><div class="brand"><span class="brand-icon">☼</span> Solar Dust Detector</div></header>
  <main> 
    <section class="card">
      <div class="check">✓</div> 
      <div class="eyebrow">Analysis complete</div>
      <h1>{{ label }} panel</h1> 
      <p class="muted">The MobileNet model has completed its classification.</p>
      <div class="score"><span>Dust score</span><strong>{{ "%.1f"|format(dust_score * 100) }}%</strong></div>
      <p class="muted filename">Image: {{ filename }}</p>
      <a href="/">← &nbsp; Classify another image</a>
    </section> 
  </main>
</body>
</html>
